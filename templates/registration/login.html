{% extends 'base.html' %}

{% block login_content %}
<div class="w-full max-w-md mx-auto p-4 sm:p-0">
    <div class="bg-white rounded-2xl shadow-soft border border-slate-100 p-8 sm:p-10 w-full relative overflow-hidden group">
        <!-- Top accent line -->
        <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-blue-500 to-purple-500"></div>
        
        <div class="text-center mb-10 mt-2">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mx-auto mb-5 transform group-hover:scale-105 transition-transform duration-300">
                <span class="text-white font-black text-3xl">R</span>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">REXIS</h1>
            <p class="text-slate-500 font-medium mt-2">Research and Extension MIS</p>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-wide font-bold">J.H. Cerilles State College</p>
        </div>
        
        <form method="post" class="space-y-6 relative z-10">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-800 p-4 rounded-xl shadow-sm mb-6 flex items-start gap-3 animate-pulse">
                <svg class="h-5 w-5 text-red-500 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
                <p class="text-sm font-semibold">Invalid username or password.</p>
            </div>
            {% endif %}
            
            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-bold text-slate-700">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </div>
                    <input type="text" name="username" id="username" required placeholder="Enter your username"
                        class="block w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                </div>
            </div>
            
            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-bold text-slate-700">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    </div>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                        class="block w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400 tracking-widest">
                </div>
            </div>
            
            <button type="submit" class="w-full flex justify-center py-3.5 px-4 rounded-xl shadow-md shadow-blue-500/20 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all active:scale-95">
                Sign In
            </button>
        </form>
    </div>
    
    <div class="mt-8 text-center">
        <a href="/" class="inline-flex items-center text-sm font-semibold text-slate-500 hover:text-blue-600 transition-colors group">
            <svg class="w-4 h-4 mr-1.5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
